name: Streamlit Health Check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Streamlit app health
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 10 \
            --max-time 60 \
            https://vie-video-intelligence-demo.streamlit.app/_stcore/health
