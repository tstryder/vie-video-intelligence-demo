name: Streamlit Keep Alive

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Selenium and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install selenium
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

      - name: Wake Streamlit app
        env:
          STREAMLIT_URL: https://vie-video-intelligence-demo.streamlit.app/
        run: |
          python - <<'PY'
          import os
          import sys
          import time

          from selenium import webdriver
          from selenium.common.exceptions import WebDriverException
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support import expected_conditions as EC
          from selenium.webdriver.support.ui import WebDriverWait

          url = os.environ["STREAMLIT_URL"]

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-gpu")
          options.add_argument("--window-size=1440,1000")

          driver = None

          try:
              driver = webdriver.Chrome(options=options)
              driver.set_page_load_timeout(90)

              print(f"Opening {url}")
              driver.get(url)

              wait = WebDriverWait(driver, 30)

              # Streamlit Community Cloud can initially show its sleep page.
              # Look for the wake-up button and click it when present.
              wake_button = None
              try:
                  wake_button = WebDriverWait(driver, 10).until(
                      EC.element_to_be_clickable(
                          (
                              By.XPATH,
                              "//button[contains(., 'Yes, get this app back up!')]"
                          )
                      )
                  )
              except Exception:
                  pass

              if wake_button is not None:
                  print("Sleep screen detected. Clicking wake-up button...")
                  driver.execute_script("arguments[0].click();", wake_button)

                  # Give Streamlit time to restart, then wait for the real app.
                  time.sleep(5)

              print("Waiting for Streamlit app to become available...")

              def app_is_loaded(d):
                  source = d.page_source.lower()
                  title = d.title.lower()
                  return (
                      "streamlit" in source
                      and "zzz" not in source
                      and "get this app back up" not in source
                  ) or "streamlit" in title

              WebDriverWait(driver, 90, poll_frequency=2).until(app_is_loaded)

              print("Streamlit app is awake.")
              print(f"Final URL: {driver.current_url}")
              print(f"Page title: {driver.title}")

          except WebDriverException as exc:
              print(f"WebDriver error: {exc}", file=sys.stderr)
              sys.exit(1)
          except Exception as exc:
              print(f"Keep-alive failed: {exc}", file=sys.stderr)
              sys.exit(1)
          finally:
              if driver is not None:
                  driver.quit()
          PY
