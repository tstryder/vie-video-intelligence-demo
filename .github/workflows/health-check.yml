name: Streamlit Keep Alive

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/health-check.yml"

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Selenium
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Wake Streamlit app
        env:
          STREAMLIT_URL: https://vie-video-intelligence-demo.streamlit.app/
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          from pathlib import Path

          from selenium import webdriver
          from selenium.common.exceptions import WebDriverException
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          url = os.environ["STREAMLIT_URL"]
          diagnostic_mode = os.environ.get("GITHUB_EVENT_NAME") != "schedule"
          diagnostic_dir = Path("streamlit-diagnostics")

          # These are distinctive strings from the actual VIE dashboard.
          # A generic Streamlit title or shell is not sufficient evidence.
          REQUIRED_MARKERS = (
              "video intelligence engine (vie)",
              "creative inspector",
              "atualizar visualizações",
          )
          SLEEP_MARKERS = (
              "get this app back up",
              "this app has gone to sleep",
              "zzz",
          )
          MAX_WAIT_SECONDS = 240
          POLL_INTERVAL_SECONDS = 3

          def body_text(driver):
              try:
                  return driver.find_element(By.TAG_NAME, "body").text
              except Exception:
                  return ""

          def save_diagnostics(driver, label):
              if not diagnostic_mode or driver is None:
                  return
              diagnostic_dir.mkdir(exist_ok=True)
              try:
                  (diagnostic_dir / f"{label}.html").write_text(
                      driver.page_source, encoding="utf-8"
                  )
                  driver.save_screenshot(str(diagnostic_dir / f"{label}.png"))
                  text = body_text(driver)
                  print(f"DIAGNOSTIC [{label}] URL: {driver.current_url}")
                  print(f"DIAGNOSTIC [{label}] title: {driver.title!r}")
                  print(f"DIAGNOSTIC [{label}] body text (first 6000 chars):")
                  print(text[:6000])
              except Exception as exc:
                  print(
                      f"Could not fully capture {label} diagnostics: "
                      f"{type(exc).__name__}: {exc}"
                  )

          def dump_browser_diagnostics(driver):
              if driver is None:
                  return
              try:
                  entries = driver.get_log("browser")
                  print(f"BROWSER_CONSOLE_ENTRY_COUNT: {len(entries)}")
                  for entry in entries[-150:]:
                      print("BROWSER_CONSOLE: " + json.dumps(entry, ensure_ascii=False))
              except Exception as exc:
                  print(f"BROWSER_LOG_UNAVAILABLE: {type(exc).__name__}: {exc}")
              try:
                  entries = driver.get_log("performance")
                  events = []
                  for entry in entries:
                      try:
                          message = json.loads(entry["message"])["message"]
                          method = message.get("method", "")
                          params = message.get("params", {})
                          if method == "Network.responseReceived":
                              response = params.get("response", {})
                              status = int(response.get("status", 0))
                              mime = response.get("mimeType", "")
                              request_id = params.get("requestId", "")
                              if status >= 400 or "websocket" in mime.lower():
                                  events.append({
                                      "event": method, "status": status, "mime": mime,
                                      "url": response.get("url", ""), "requestId": request_id
                                  })
                          elif method == "Network.loadingFailed":
                              events.append({
                                  "event": method, "requestId": params.get("requestId"),
                                  "errorText": params.get("errorText"),
                                  "blockedReason": params.get("blockedReason"),
                                  "canceled": params.get("canceled")
                              })
                          elif method == "Network.webSocketCreated":
                              events.append({
                                  "event": method, "requestId": params.get("requestId"),
                                  "url": params.get("url")
                              })
                          elif method == "Network.webSocketFrameError":
                              events.append({"event": method, "params": params})
                      except Exception:
                          continue
                  print(f"NETWORK_DIAGNOSTIC_EVENT_COUNT: {len(events)}")
                  for event in events[-200:]:
                      print("NETWORK_DIAGNOSTIC: " + json.dumps(event, ensure_ascii=False))
              except Exception as exc:
                  print(f"PERFORMANCE_LOG_UNAVAILABLE: {type(exc).__name__}: {exc}")

          def page_state(driver):
              text = body_text(driver).casefold()
              markers = [marker for marker in REQUIRED_MARKERS if marker in text]
              sleep_markers = [marker for marker in SLEEP_MARKERS if marker in text]
              ready = len(markers) == len(REQUIRED_MARKERS) and not sleep_markers
              return ready, markers, sleep_markers, text

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-gpu")
          options.add_argument("--window-size=1440,1000")
          options.set_capability("goog:loggingPrefs", {
              "browser": "ALL",
              "performance": "ALL",
          })
          options.add_experimental_option("perfLoggingPrefs", {
              "enableNetwork": True,
              "enablePage": True,
          })

          driver = None

          try:
              driver = webdriver.Chrome(options=options)
              driver.set_page_load_timeout(90)
              driver.set_script_timeout(30)

              print(f"Opening {url}")
              driver.get(url)
              save_diagnostics(driver, "initial-page")

              deadline = time.monotonic() + MAX_WAIT_SECONDS
              wake_clicks = 0
              last_state = None
              app_ready = False
              next_snapshot = time.monotonic() + 30
              snapshot_number = 1

              while time.monotonic() < deadline:
                  # A sleeping Community Cloud app exposes this explicit button.
                  # Re-check during polling in case the sleep page appears after
                  # the initial document load.
                  try:
                      buttons = driver.find_elements(
                          By.XPATH,
                          "//button[contains(., 'Yes, get this app back up!')]",
                      )
                      clickable = next(
                          (
                              button for button in buttons
                              if button.is_displayed() and button.is_enabled()
                          ),
                          None,
                      )
                      if clickable is not None:
                          print("SLEEP_PAGE_DETECTED: clicking wake-up button.")
                          driver.execute_script("arguments[0].click();", clickable)
                          wake_clicks += 1
                          print(f"WAKE_BUTTON_CLICKS: {wake_clicks}")
                          time.sleep(2)
                          if wake_clicks == 1:
                              save_diagnostics(driver, "after-wake-click")
                  except WebDriverException as exc:
                      print(f"Wake-button inspection/click issue: {type(exc).__name__}: {exc}")

                  ready, markers, sleep_markers, text = page_state(driver)
                  state = (
                      "READY" if ready else
                      "SLEEP_PAGE" if sleep_markers else
                      "LOADING_OR_UNRECOGNIZED"
                  )
                  if state != last_state:
                      print(
                          f"PAGE_STATE: {state}; "
                          f"dashboard_markers={markers}; sleep_markers={sleep_markers}"
                      )
                      last_state = state

                  if ready:
                      app_ready = True
                      break

                  if diagnostic_mode and time.monotonic() >= next_snapshot:
                      save_diagnostics(driver, f"progress-{snapshot_number:02d}")
                      snapshot_number += 1
                      next_snapshot = time.monotonic() + 30

                  time.sleep(POLL_INTERVAL_SECONDS)

              if not app_ready:
                  ready, markers, sleep_markers, text = page_state(driver)
                  print(
                      "READINESS_CHECK_FAILED: the distinctive VIE dashboard "
                      "markers did not all appear before timeout.",
                      file=sys.stderr,
                  )
                  print(f"Final URL: {driver.current_url}", file=sys.stderr)
                  print(f"Page title: {driver.title!r}", file=sys.stderr)
                  print(f"Dashboard markers found: {markers}", file=sys.stderr)
                  print(f"Sleep markers found: {sleep_markers}", file=sys.stderr)
                  print(f"Final body text (first 6000 chars): {text[:6000]}", file=sys.stderr)
                  save_diagnostics(driver, "timeout-page")
                  dump_browser_diagnostics(driver)
                  sys.exit(1)

              print("READINESS_CHECK_PASSED: VIE dashboard markers are visible.")
              dump_browser_diagnostics(driver)
              print(f"Wake button clicks: {wake_clicks}")
              print(f"Final URL: {driver.current_url}")
              print(f"Page title: {driver.title}")
              save_diagnostics(driver, "final-page")

          except WebDriverException as exc:
              print(f"WebDriver error: {exc}", file=sys.stderr)
              save_diagnostics(driver, "error-page")
              sys.exit(1)
          except Exception as exc:
              print(f"Keep-alive failed: {type(exc).__name__}: {exc}", file=sys.stderr)
              save_diagnostics(driver, "error-page")
              sys.exit(1)
          finally:
              if driver is not None:
                  driver.quit()
          PY

      - name: Upload diagnostic evidence
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-keep-alive-diagnostics
          path: streamlit-diagnostics/
          if-no-files-found: warn
          retention-days: 3
