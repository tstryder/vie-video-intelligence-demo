name: Streamlit Keep Alive

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Selenium and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install selenium
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

      - name: Wake Streamlit app
        env:
          STREAMLIT_URL: https://vie-video-intelligence-demo.streamlit.app/
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          from pathlib import Path

          from selenium import webdriver
          from selenium.common.exceptions import WebDriverException
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support import expected_conditions as EC
          from selenium.webdriver.support.ui import WebDriverWait

          url = os.environ["STREAMLIT_URL"]
          diagnostic_mode = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          diagnostic_dir = Path("streamlit-diagnostics")

          def save_diagnostics(driver, label):
              if not diagnostic_mode or driver is None:
                  return
              diagnostic_dir.mkdir(exist_ok=True)
              try:
                  (diagnostic_dir / f"{label}.html").write_text(
                      driver.page_source, encoding="utf-8"
                  )
                  driver.save_screenshot(str(diagnostic_dir / f"{label}.png"))
                  body_text = driver.find_element(By.TAG_NAME, "body").text
                  buttons = driver.find_elements(By.TAG_NAME, "button")
                  print(f"DIAGNOSTIC [{label}] URL: {driver.current_url}")
                  print(f"DIAGNOSTIC [{label}] title: {driver.title!r}")
                  print(f"DIAGNOSTIC [{label}] body text (first 6000 chars):")
                  print(body_text[:6000])
                  print(f"DIAGNOSTIC [{label}] buttons ({len(buttons)}):")
                  for index, button in enumerate(buttons[:50]):
                      print(
                          f"  [{index}] text={button.text!r} "
                          f"aria-label={button.get_attribute('aria-label')!r} "
                          f"disabled={button.get_attribute('disabled')!r}"
                      )
              except Exception as exc:
                  print(f"Could not fully capture {label} diagnostics: {type(exc).__name__}: {exc}")

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-gpu")
          options.add_argument("--window-size=1440,1000")

          driver = None

          try:
              driver = webdriver.Chrome(options=options)
              driver.set_page_load_timeout(90)

              print(f"Opening {url}")
              driver.get(url)
              save_diagnostics(driver, "initial-page")

              # Streamlit Community Cloud can initially show its sleep page.
              # Keep the existing selector for this diagnostic run, but log
              # the actual page state when the selector does not match.
              wake_button = None
              try:
                  wake_button = WebDriverWait(driver, 10).until(
                      EC.element_to_be_clickable(
                          (
                              By.XPATH,
                              "//button[contains(., 'Yes, get this app back up!')]"
                          )
                      )
                  )
              except Exception as exc:
                  print(
                      "WAKE_BUTTON_NOT_FOUND_OR_NOT_CLICKABLE: "
                      f"{type(exc).__name__}: {exc}"
                  )

              if wake_button is not None:
                  print("Sleep screen detected. Clicking wake-up button...")
                  driver.execute_script("arguments[0].click();", wake_button)
                  time.sleep(5)
                  save_diagnostics(driver, "after-wake-click")
              else:
                  print("No wake-up button was detected by the current XPath.")

              print("Waiting for Streamlit app to become available...")

              def app_is_loaded(d):
                  source = d.page_source.lower()
                  title = d.title.lower()
                  return (
                      "streamlit" in source
                      and "zzz" not in source
                      and "get this app back up" not in source
                  ) or "streamlit" in title

              WebDriverWait(driver, 90, poll_frequency=2).until(app_is_loaded)

              print("Streamlit app is awake.")
              print(f"Final URL: {driver.current_url}")
              print(f"Page title: {driver.title}")
              save_diagnostics(driver, "final-page")

          except WebDriverException as exc:
              print(f"WebDriver error: {exc}", file=sys.stderr)
              save_diagnostics(driver, "error-page")
              sys.exit(1)
          except Exception as exc:
              print(f"Keep-alive failed: {exc}", file=sys.stderr)
              save_diagnostics(driver, "error-page")
              sys.exit(1)
          finally:
              if driver is not None:
                  driver.quit()
          PY

      - name: Upload diagnostic evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-keep-alive-diagnostics
          path: streamlit-diagnostics/
          if-no-files-found: warn
          retention-days: 3
