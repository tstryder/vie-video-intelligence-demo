name: Streamlit Keep Alive

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Visit Streamlit app
        run: |
          curl --fail --silent --show-error \
            --location \
            --retry 3 \
            --retry-delay 10 \
            --max-time 60 \
            -A "Mozilla/5.0" \
            https://vie-video-intelligence-demo.streamlit.app/
